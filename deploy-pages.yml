# Build & terbitkan ke GitHub Pages setiap push ke branch main.
# Aktifkan sekali: Settings → Pages → Source: "GitHub Actions".
name: Deploy ke GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Tentukan BASE_PATH
        # https://<akun>.github.io/<nama-repo>/ → BASE_PATH=/<nama-repo> (otomatis).
        # Repo <akun>.github.io atau domain sendiri (public/CNAME) → tanpa BASE_PATH.
        # Bisa dipaksa lewat Settings → Variables → BASE_PATH (isi "/" untuk kosong).
        run: |
          BP="${{ vars.BASE_PATH }}"
          REPO="${{ github.event.repository.name }}"
          if [ -z "$BP" ]; then
            if [[ "$REPO" == *.github.io ]] || [ -f public/CNAME ]; then BP=""; else BP="/$REPO"; fi
          fi
          [ "$BP" = "/" ] && BP=""
          echo "BASE_PATH=$BP" >> "$GITHUB_ENV"
          echo "BASE_PATH = '$BP'"
      - name: Build (ekspor statis)
        run: npm run build
      - run: touch out/.nojekyll
      - uses: actions/upload-pages-artifact@v3
        with:
          path: out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
